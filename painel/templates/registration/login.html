<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito - Recicla & Educa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
    
    <div class="bg-slate-800 p-10 rounded-[2rem] shadow-2xl w-full max-w-md border-t-8 border-green-500">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-green-400"><i class="fa-solid fa-leaf"></i> Recicla & Educa</h2>
            <p class="text-slate-300 font-bold mt-2">Portal de Gestão e Logística</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-slate-300 font-bold mb-2">Utilizador</label>
                <input type="text" name="username" placeholder="Digite o seu utilizador..." class="w-full px-4 py-3 bg-slate-700 text-white border border-slate-600 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/50 transition" required>
            </div>
            
            <div>
                <label class="block text-slate-300 font-bold mb-2">Senha</label>
                <input type="password" name="password" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-700 text-white border border-slate-600 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/50 transition" required>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white font-black py-4 rounded-xl hover:bg-green-500 transition shadow-lg transform hover:-translate-y-1">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> ENTRAR NO SISTEMA
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="{% url 'index' %}" class="text-sm font-bold text-slate-400 hover:text-green-400 transition">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Portal do Cidadão
            </a>
        </div>
    </div>

</body>
</html>
